{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cloudpulse.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudpulse.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - {{- if .host }}
      host: {{ .host | quote }}
      {{- end }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "cloudpulse.fullname" $ }}-{{ .service }}
                port:
                  number: {{ if eq .service "api" }}3001{{ else if eq .service "gateway" }}4000{{ else }}80{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
