name: Kubernetes & Helm Validation

on:
  push:
    paths:
      - 'deploy/kubernetes/**'
      - 'helm/**'
      - '.github/workflows/k8s-validate.yml'
  pull_request:
    paths:
      - 'deploy/kubernetes/**'
      - 'helm/**'
      - '.github/workflows/k8s-validate.yml'

jobs:
  validate-k8s:
    name: Validate Manifests & Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Helm Lint
        run: |
          helm lint helm/cloudpulse
          helm lint helm/cloudpulse -f helm/cloudpulse/values-dev.yaml
          helm lint helm/cloudpulse -f helm/cloudpulse/values-prod.yaml

      - name: Setup Kubeconform / Conftest
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes Manifests
        run: |
          kubeconform -summary -strict deploy/kubernetes/
