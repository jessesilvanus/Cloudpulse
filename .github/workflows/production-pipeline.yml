name: CloudPulse Production Hardened Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: prod-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-test:
    name: 1. Code Quality, Unit Tests & Multi-Tier Health Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Run Full Workspace Test Suite (714+ tests)
        run: pnpm test

      - name: Build Packages & Frontend
        run: pnpm -r build

  security-and-sbom:
    name: 2. Container Security Scan & SBOM Generation
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: cloudpulse-api:production-check
          load: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloudpulse-api:production-check'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  deploy-and-verify:
    name: 3. Production Deployment & Live Verification
    runs-on: ubuntu-latest
    needs: [validate-and-test, security-and-sbom]
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute 19-Step Cloud Smoke Test Verification
        run: |
          pnpm --filter @cloudpulse/api exec tsx ../../test/cloud-smoke-test.ts
