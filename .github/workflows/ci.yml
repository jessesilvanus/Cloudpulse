name: CloudPulse CI Pipeline

on:
  push:
    branches: [main, master, "release/*"]
  pull_request:
    branches: [main, master]

# Prevent redundant workflow runs on same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Run Test Suites
        run: pnpm test

      - name: Build Workspace Packages & Apps
        run: pnpm -r build

  docker-build-check:
    name: Verify Docker Multi-Stage Image Builds
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: cloudpulse-web:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API Gateway Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: cloudpulse-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Ingress API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api-gateway/Dockerfile
          push: false
          tags: api-gateway:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Order Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/order-service/Dockerfile
          push: false
          tags: order-service:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Payment Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/payment-service/Dockerfile
          push: false
          tags: payment-service:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
