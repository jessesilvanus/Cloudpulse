apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: cloudpulse
  labels:
    app.kubernetes.io/name: traffic-generator
    app.kubernetes.io/component: traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-generator
        app.kubernetes.io/component: traffic-generator
    spec:
      serviceAccountName: cloudpulse-workloads
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: traffic-generator
          image: cloudpulse/traffic-generator:v0.0.3
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: "production"
            - name: TARGET_URL
              value: "http://api-gateway.cloudpulse.svc.cluster.local:4000/api/checkout"
            - name: TRAFFIC_INTERVAL_MS
              value: "2500"
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
