services:
  # ── CloudPulse SRE Console Web Frontend ─────────────────────────────────
  cloudpulse-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cloudpulse-web
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=production
    depends_on:
      cloudpulse-api:
        condition: service_healthy
    networks:
      - cloudpulse-net

  # ── CloudPulse Telemetry Gateway & Normalizer API ────────────────────────
  cloudpulse-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cloudpulse-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TELEMETRY_MODE=live
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - TEMPO_URL=http://tempo:3200
      - API_GATEWAY_URL=http://api-gateway:4000
      - ORDER_SERVICE_URL=http://order-service:4001
      - PAYMENT_SERVICE_URL=http://payment-service:4002
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - otel-collector
      - prometheus
      - loki
      - tempo
      - api-gateway
      - order-service
      - payment-service
    networks:
      - cloudpulse-net

  # ── Ingress Microservice: API Gateway ────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: cloudpulse-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - ORDER_SERVICE_URL=http://order-service:4001
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - cloudpulse-net

  # ── Core Microservice: Order Service ────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: cloudpulse-order-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - PAYMENT_SERVICE_URL=http://payment-service:4002
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - cloudpulse-net

  # ── Core Microservice: Payment Service & Fault Sandbox ───────────────────
  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: cloudpulse-payment-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=production
      - PORT=4002
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4002/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - cloudpulse-net

  # ── OpenTelemetry Collector (Contrib) ───────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: cloudpulse-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./infra/observability/otel-collector/otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8888:8888" # Collector telemetry metrics
      - "8889:8889" # Prometheus metrics exporter
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - cloudpulse-net

  # ── Prometheus TSDB (Metrics Storage) ───────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: cloudpulse-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - cloudpulse-net

  # ── Grafana Loki (Log Aggregation) ──────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: cloudpulse-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infra/observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - cloudpulse-net

  # ── Grafana Tempo (Distributed Tracing Storage) ─────────────────────────
  tempo:
    image: grafana/tempo:2.5.0
    container_name: cloudpulse-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/observability/tempo/tempo-config.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200" # Tempo HTTP
    networks:
      - cloudpulse-net

  # ── Background Traffic Simulator ────────────────────────────────────────
  traffic-generator:
    build:
      context: .
      dockerfile: services/traffic-generator/Dockerfile
    container_name: cloudpulse-traffic-generator
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TARGET_URL=http://api-gateway:4000/api/checkout
      - TRAFFIC_INTERVAL_MS=2500
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - cloudpulse-net

networks:
  cloudpulse-net:
    driver: bridge

volumes:
  prometheus_data:
    name: cloudpulse_prometheus_data
  loki_data:
    name: cloudpulse_loki_data
  tempo_data:
    name: cloudpulse_tempo_data
